name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install lcov
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: Run native unit tests
      run: pio test -e native || true
    - name: Generate Coverage Report
      run: |
        lcov --capture --base-directory . --directory .pio/build/native/ --output-file lcov_raw.info --rc branch_coverage=1 --ignore-errors "gcov,source"
        lcov --remove lcov_raw.info '*/.pio/*' '*/tests/*' '/usr/*' --ignore-errors "unused,source" -o lcov.info --rc branch_coverage=1
    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: lcov.info

  build-firmware:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: Build CYD 2.8 firmware
      run: pio run -e cyd_28r
    - name: Build CYD 3.5 firmware
      run: pio run -e cyd_35c
