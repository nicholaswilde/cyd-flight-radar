[platformio]
default_envs = cyd_28r
test_dir = tests

[env]
monitor_speed = 115200

[cyd_base]
platform = espressif32
board = esp32dev
framework = arduino
upload_speed = 921600
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py
board_build.embed_files = data/ui_font.vlw
build_flags =
  -std=gnu++17
  -DWM_NODEBUG
  -DWM_MDNS
  -I include/
  -D USE_HSPI_PORT=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:cyd_28r]
extends = cyd_base
build_flags =
  ${cyd_base.build_flags}
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BL=21
  -D XPT2046_CS=33
  -D XPT2046_IRQ=36
  -D XPT2046_MOSI=32
  -D XPT2046_MISO=39
  -D XPT2046_CLK=25


[env:cyd_35c]
extends = cyd_base
build_flags =
  ${cyd_base.build_flags}
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_BL=27
